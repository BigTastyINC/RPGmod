# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml"
# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion="${loader_version_range}" 
# The license for you mod.
license="All Rights Reserved"
# A list of mods
[[mods]]
# The modid of the mod (должен совпадать с тем, что в @Mod("...") в главном классе)
modId="examplemod"
# Версия мода, которая будет видна в игре
version="1.16.5"
# Имя, которое будет видно в игре
displayName="RPGmod"
# Твой никнейм (отображается как автор)
authors="BigTastyINC"
# Описание мода (видно при наведении в меню)
description='''Полноценный RPG мод с уровнями, характеристиками, магией, кастомными рудами, оружием, броней и торговцами!'''

# ==========================================
# Зависимости (не трогаем)
# ==========================================

[[dependencies.examplemod]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.examplemod]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Мягкая зависимость от Tinkers' Construct
[[dependencies.examplemod]]
modId="tconstruct"
mandatory=false
versionRange="[3.0.0,)"
ordering="AFTER"
side="BOTH"